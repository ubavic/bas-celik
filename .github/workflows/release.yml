name: "Build and release"

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Linux deps
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libpcsclite-dev libgl1-mesa-dev xorg-dev
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
      - name: Install Fyne
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Test
        run: go test ./...

  buildLinux:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Linux deps
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libpcsclite-dev libgl1-mesa-dev xorg-dev
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
      - name: Install Fyne
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Generate version file
        run: |
          VERSION=$(git describe --tags --abbrev=0 | tail -c +2)
          echo "$VERSION" >> assets/version
          echo "  Version = \"$VERSION\"" >> FyneApp.toml
      - name: Build and package GUI version
        run: |
          fyne package -os linux -release
          mv 'Bas Celik.tar.xz' bas-celik.linux.amd64.tar.xz
      - name: Extract bin
        run: |
          mkdir tmpcelik
          tar -xf bas-celik.linux.amd64.tar.xz -C tmpcelik/
          cp tmpcelik/bas-celik/usr/local/bin/bas-celik bas-celik.linux.amd64.bin
      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - name: Build DEB and RPM packages
        run: |
          VERSION=$(git describe --tags --abbrev=0 | tail -c +2)
          sed "s/__VERSION__/${VERSION}/g" packaging/nfpm/debian.yaml > nfpm.debian.yaml
          sed "s/__VERSION__/${VERSION}/g" packaging/nfpm/fedora.yaml > nfpm.fedora.yaml
          "$(go env GOPATH)"/bin/nfpm package --packager deb --config nfpm.debian.yaml --target bas-celik.linux.amd64.deb
          "$(go env GOPATH)"/bin/nfpm package --packager rpm --config nfpm.fedora.yaml --target bas-celik.linux.amd64.rpm
      - name: Build CLI version
        run: |
          echo -n "cli" >> assets/version
          rm -R embed/translation
          go build -tags "cli" -ldflags "-s -w" -o cli-bas-celik.linux.amd64 .
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-build-artifact
          path: |
            bas-celik.linux.amd64.tar.xz
            bas-celik.linux.amd64.bin
            bas-celik.linux.amd64.deb
            bas-celik.linux.amd64.rpm
            cli-bas-celik.linux.amd64

  buildWindows:
    runs-on: windows-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
      - name: Install Fyne
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Generate version file
        run: |
          $version = (git describe --tags --abbrev=0).Substring(1)
          $version | Out-File -FilePath "assets/version" -Append
          "  Version = `"$version`"" | Out-File -FilePath "FyneApp.toml" -Append
      - name: Build
        run: |
          fyne package -os windows -release
          mv 'Bas Celik.exe' bas-celik.windows.amd64.exe
      - name: Upload executables
        uses: actions/upload-artifact@v7
        with:
          name: windows-build-artifact
          path: bas-celik.windows.amd64.exe

  buildMacOsArm:
    runs-on: macos-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
      - name: Install Fyne
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Generate version file
        run: |
          VERSION=$(git describe --tags --abbrev=0 | tail -c +2)
          echo "$VERSION" >> assets/version
          echo "  Version = \"$VERSION\"" >> FyneApp.toml
      - name: Build GUI version
        run: |
          fyne package -os darwin -release
          codesign --force --deep -s - 'Bas Celik.app'
          tar -czf bas-celik.macos.arm.tar.gz 'Bas Celik.app'
      - name: Build CLI version
        run: |
          echo -n "cli" >> assets/version
          rm -R embed/translation
          go build -tags "cli" -ldflags "-s -w" -o cli-bas-celik.macos.arm .
      - name: Upload macOS ARM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm-build-artifact
          path: |
            bas-celik.macos.arm.tar.gz
            cli-bas-celik.macos.arm

  buildMacOsIntel:
    runs-on: macos-15-intel
    needs: [test]
    env:
      GOOS: darwin
      GOARCH: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: "stable"
      - name: Install Fyne
        run: go install fyne.io/tools/cmd/fyne@latest
      - name: Generate version file
        run: |
          VERSION=$(git describe --tags --abbrev=0 | tail -c +2)
          echo "$VERSION" >> assets/version
          echo "  Version = \"$VERSION\"" >> FyneApp.toml
      - name: Build GUI version
        run: |
          fyne package -os darwin -release
          codesign --force --deep -s - 'Bas Celik.app'
          tar -czf bas-celik.macos.intel.tar.gz 'Bas Celik.app'
      - name: Build CLI version
        run: |
          echo -n "cli" >> assets/version
          rm -R embed/translation
          go build -tags "cli" -ldflags "-s -w" -o cli-bas-celik.macos.intel .
      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-intel-build-artifact
          path: |
            bas-celik.macos.intel.tar.gz
            cli-bas-celik.macos.intel

  release:
    runs-on: ubuntu-latest
    needs: [buildLinux, buildWindows, buildMacOsArm, buildMacOsIntel]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
      - name: Move files
        run: |
          mv linux-build-artifact/* .
          mv windows-build-artifact/* .
          mv macos-arm-build-artifact/* .
          mv macos-intel-build-artifact/* .
      - name: Generate release body
        run: |
          touch changelog.md
          git tag -l --format='%(contents)' ${{github.ref_name}} >> changelog.md
          echo '' >> changelog.md
          echo 'CLI verzije su verzije bez grafičkog interfejsa i namenjene su za napredne korisnike' >> changelog.md
          echo '' >> changelog.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bas-celik.linux.amd64.tar.xz
            bas-celik.linux.amd64.bin
            bas-celik.linux.amd64.deb
            bas-celik.linux.amd64.rpm
            cli-bas-celik.linux.amd64
            bas-celik.windows.amd64.exe
            bas-celik.macos.arm.tar.gz
            cli-bas-celik.macos.arm
            bas-celik.macos.intel.tar.gz
            cli-bas-celik.macos.intel
          body_path: changelog.md
          tag_name: ${{github.ref_name}}
