name: bas-celik
arch: amd64
platform: linux
version: __VERSION__
release: 1
section: default
priority: optional
maintainer: Bas Celik
description: Bas Celik application
vendor: Bas Celik
homepage: https://github.com/ubavic/bas-celik/
license: MIT
depends:
  - libccid
  - pcscd
contents:
  - src: ./bas-celik.linux.amd64.bin
    dst: /usr/bin/bas-celik
    file_info:
      mode: 0755
  - src: ./assets/application.desktop
    dst: /usr/share/applications/bas-celik.desktop
    file_info:
      mode: 0644
  - src: ./assets/logo.png
    dst: /usr/share/icons/hicolor/512x512/apps/bas-celik.png
    file_info:
      mode: 0644
